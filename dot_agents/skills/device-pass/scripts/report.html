<!doctype html><html lang="en"><head><meta charset="utf-8">{{HEAD}}<meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title><style>{{CSS}}</style></head><body>
<header class="topbar"><p class="eyebrow">Device pass</p><h1>{{TITLE}}</h1><nav class="links">{{LINKS}}</nav><label class="zoom">Zoom <input id="zoom" type="range" min="40" max="150" value="80"><output id="zoom-value">80%</output></label></header>
<main>{{SUMMARY}}{{VIDEOS}}{{CARDS}}<noscript><p class="note">Images in this file need JavaScript to display.</p></noscript></main>
<dialog id="viewer" aria-labelledby="viewer-title"><div class="viewer"><header><h2 id="viewer-title"></h2><span id="position" class="dim"></span><button id="previous" type="button" aria-label="Previous image">←</button><button id="next" type="button" aria-label="Next image">→</button><button id="close" type="button" aria-label="Close">✕</button></header><div class="stage"><img id="viewer-image" alt=""></div></div></dialog>{{IMAGES}}<script>{{JS}}</script></body></html>
