# Pickforge, formerly PickLab: the bun package (pickforge-lab, pickforge-mcp) and the Rust CLI.
label=Pickforge
repo=~/Projects/Pickforge/pickforge
ref=origin/main
build='bun install --frozen-lockfile
bun run build
cargo build --release --locked -p pickforge-cli --target-dir "$DEVLOOP_CACHE/target"
rm -rf "$DEVLOOP_CACHE/pack" && mkdir -p "$DEVLOOP_CACHE/pack"
(cd packages/cli && npm pack --silent --pack-destination "$DEVLOOP_CACHE/pack" >/dev/null)
version=$(jq -r .version packages/cli/package.json)
node packages/cli/dist/pickforge-lab.js --version | grep -qF "$version"
"$DEVLOOP_CACHE/target/release/pickforge" --version | grep -qF "$version"'
# bun keeps pointing at this tarball path, so it must stay fixed.
install='cp "$DEVLOOP_CACHE"/pack/pickforge-*.tgz "$DEVLOOP_CACHE/pickforge.tgz"
bun add --global "$DEVLOOP_CACHE/pickforge.tgz"
install -m 0755 "$DEVLOOP_CACHE/target/release/pickforge" ~/.bun/bin/.pickforge.new
mv -f ~/.bun/bin/.pickforge.new ~/.bun/bin/pickforge'
