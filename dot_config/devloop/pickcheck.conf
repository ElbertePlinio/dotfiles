label=PickCheck
repo=~/Projects/Pickforge/pickcheck
ref=origin/main
build='cargo build --release --locked -p pickcheck --target-dir "$DEVLOOP_CACHE/target"
"$DEVLOOP_CACHE/target/release/pickcheck" --version'
install='install -m 0755 "$DEVLOOP_CACHE/target/release/pickcheck" ~/.local/bin/.pickcheck.new
mv -f ~/.local/bin/.pickcheck.new ~/.local/bin/pickcheck'
