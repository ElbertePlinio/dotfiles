label=PickScribe
repo=~/Projects/Pickforge/archived/pickscribe
ref=rewrite-daemon
build='CARGO_TARGET_DIR="$DEVLOOP_CACHE/target" cargo build --release --locked'
# Never restart in the middle of a dictation.
idle='! pickscribe status 2>/dev/null | grep -qE "\"state\":\"(listening|thinking)\""'
install='CARGO_TARGET_DIR="$DEVLOOP_CACHE/target" scripts/install'
