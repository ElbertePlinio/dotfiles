# pi-caffeinate defaults to systemd-inhibit --what=idle:sleep.
# block-sleep needs polkit admin auth when Pi is not an "active" seat
# session, which dumps pkttyagent prompts into the TUI and steals input.
# idle-only is allow_any=yes and still prevents automatic idle suspend.
# Quotes are for pi-caffeinate's argv splitter (environment.d keeps them literal).
PI_CAFFEINATE_COMMAND=systemd-inhibit --what=idle --who=pi-caffeinate --why="Pi agent is running" --mode=block sleep infinity
