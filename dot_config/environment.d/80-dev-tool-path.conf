# Restored developer tool paths for GUI/session-launched tools.
# Keep mise shims before ~/.local/bin so Pi/Claude/Codex/Grok/OMP emit clean machine-readable output.
PATH=${HOME}/.local/share/mise/shims:${HOME}/.bun/bin:${HOME}/.grok/bin:${HOME}/.local/share/pnpm:${HOME}/.pub-cache/bin:${HOME}/.cargo/bin:${HOME}/ProgramsDev/flutter/bin:${HOME}/fvm/bin:${HOME}/.local/bin:${PATH}
BUN_INSTALL=${HOME}/.bun
PNPM_HOME=${HOME}/.local/share/pnpm
CHROME_EXECUTABLE=/usr/bin/google-chrome-stable
