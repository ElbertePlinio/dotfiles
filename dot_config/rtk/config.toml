[tracking]
enabled = true
history_days = 90

[display]
colors = true
emoji = true
max_width = 120

[filters]
ignore_dirs = [
    ".git",
    "node_modules",
    "target",
    "__pycache__",
    ".venv",
    "vendor",
]
ignore_files = [
    "*.lock",
    "*.min.js",
    "*.min.css",
]

[tee]
enabled = true
mode = "failures"
max_files = 20
max_file_size = 1048576

[telemetry]
enabled = false
consent_given = false
consent_date = "2026-04-27T12:09:19.250599436+00:00"

[hooks]
exclude_commands = [
    "go test",
    "cargo test",
    "pytest",
    "vitest",
    "jest",
    "npm test",
    "pnpm test",
    "yarn test",
    "flutter test",
    "dart test",
    "flutter analyze",
    "dart analyze",
    "git diff",
    "git status",
    "grep",
    "rg",
    "tsc",
    "eslint",
    "lint",
]

[limits]
grep_max_results = 200
grep_max_per_file = 25
status_max_files = 15
status_max_untracked = 10
passthrough_max_chars = 2000
